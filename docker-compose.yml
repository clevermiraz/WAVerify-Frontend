# Frontend only. The API, Postgres and Redis live in the WAVerify-Backend
# repo's compose file; this project name is kept distinct so the two stacks can
# run side by side without one overwriting the other's containers.
name: waverify-frontend

services:
  frontend:
    build:
      context: .
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the client
        # bundle, so these cannot be supplied at runtime. Origin only — the
        # /api/v1 prefix is owned by the client code.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env (e.g. https://api.waverify.app)}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        SITE_URL: ${SITE_URL:-https://waverify.app}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
